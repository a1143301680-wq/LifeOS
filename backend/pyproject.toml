[project]
name = "lifeos-backend"
version = "0.1.0"
description = "LifeOS Phase 1A FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.2",
    "argon2-cffi>=23.1.0",
    "fastapi>=0.111.0",
    "openai==3.19.2",
    "psycopg[binary]>=3.2.1",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "uvicorn[standard]>=0.30.5",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.2",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
